<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MÉDITRA — Connexion en cours.">
  <meta name="theme-color" content="#0a3327">
  <title>MÉDITRA — Connexion en cours…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --green:#0f4c3a;
      --green-2:#1a6b52;
      --green-dark:#0a3327;
      --success:#10b981;
      --gold:#c99b45;
      --gold-soft:#f1cf91;
      --serif:"DM Serif Display",Georgia,serif;
      --sans:"Manrope",Arial,sans-serif;
      --ease:cubic-bezier(.2,.8,.2,1);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:var(--sans);color:#fff;-webkit-font-smoothing:antialiased;
      background:linear-gradient(135deg,var(--green-dark) 0%,var(--green) 100%);
      overflow:hidden;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
      animation:pageIn .6s var(--ease) both;
    }
    body.leaving{animation:pageOut .55s var(--ease) forwards}
    @keyframes pageIn{from{opacity:0}to{opacity:1}}
    @keyframes pageOut{to{opacity:0;transform:scale(1.02)}}
    button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
    a{color:inherit;text-decoration:none}
    :focus-visible{outline:2px solid var(--gold);outline-offset:3px}

    /* ===== Fond ===== */
    .bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
    .bg::before{content:"";position:absolute;top:46%;left:50%;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,rgba(201,155,69,.17) 0%,transparent 70%);transform:translate(-50%,-50%);animation:pulseGlow 5s ease-in-out infinite alternate}
    .bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 72%);mask-image:radial-gradient(ellipse at center,#000 25%,transparent 72%)}
    @keyframes pulseGlow{0%{transform:translate(-50%,-50%) scale(1);opacity:.55}100%{transform:translate(-50%,-50%) scale(1.18);opacity:1}}
    .particle{position:absolute;background:var(--gold);border-radius:50%;opacity:0;animation:floatUp var(--d,10s) linear infinite;animation-delay:var(--delay,0s)}
    @keyframes floatUp{0%{transform:translateY(0) scale(1);opacity:0}20%{opacity:.6}80%{opacity:.5}100%{transform:translateY(-160px) scale(0);opacity:0}}

    /* ===== En-tête / pied ===== */
    .top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:22px 40px;animation:fadeDown .7s var(--ease) .1s both}
    .brand{display:flex;align-items:center;gap:12px}
    .brand-mark{width:30px;height:auto;color:#fff}
    .brand-name{display:block;font-size:18px;line-height:1;font-weight:800;letter-spacing:.1em}
    .brand-sub{display:block;margin-top:5px;font-size:9px;color:rgba(255,255,255,.6);letter-spacing:.06em;text-transform:uppercase}
    .secure{display:inline-flex;align-items:center;gap:8px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 12px}
    .secure svg{width:13px;height:13px;color:var(--gold)}

    .foot{position:relative;z-index:2;text-align:center;padding:18px 20px 24px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);animation:fadeUp .8s var(--ease) .6s both}
    .foot span{color:var(--gold)}

    /* ===== Scène centrale ===== */
    .stage{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px;min-height:0}
    .hero{position:relative;width:min(420px,90vw);height:min(400px,48vh);flex:none}
    .orbit{position:absolute;top:50%;left:50%;width:min(380px,46vh,88vw);aspect-ratio:1;border-radius:50%;border:1px solid rgba(201,155,69,.3);transform:translate(-50%,-50%);animation:orbitIn 1.2s var(--ease) both}
    .orbit.inner{width:min(270px,33vh,64vw);border-color:rgba(255,255,255,.07);animation-delay:.15s}
    .orbit::after{content:"";position:absolute;inset:-28px;border:1px dashed rgba(255,255,255,.1);border-radius:50%;animation:spin 30s linear infinite}
    .orbit.inner::after{animation-direction:reverse;animation-duration:44s}
    @keyframes orbitIn{from{opacity:0;scale:.85}to{opacity:1;scale:1}}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Arc de progression doré autour de la médaille */
    .ring{position:absolute;top:50%;left:50%;width:min(380px,46vh,88vw);aspect-ratio:1;transform:translate(-50%,-50%) rotate(-90deg);overflow:visible;animation:orbitIn 1.2s var(--ease) .1s both}
    .ring circle{fill:none;stroke-width:2}
    .ring .track{stroke:rgba(255,255,255,.06)}
    .ring .bar{stroke:var(--gold);stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(201,155,69,.6))}
    .ring .dot{fill:var(--gold-soft);stroke:none;filter:drop-shadow(0 0 6px rgba(241,207,145,.9))}

    .medal{position:absolute;left:50%;top:50%;width:min(210px,26vh,50vw);transform:translate(-50%,-50%) rotate(-5deg);filter:drop-shadow(14px 24px 18px rgba(0,0,0,.4))}
    .medal-float{animation:medalFloat 6s ease-in-out infinite}
    .medal-svg{display:block;width:100%;height:auto;overflow:visible;animation:medalIn 1.1s var(--ease) .15s both}
    @keyframes medalFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(1.5deg)}}
    @keyframes medalIn{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:none}}
    .sheen{animation:sheen 3.2s ease-in-out infinite;opacity:0}
    @keyframes sheen{0%,20%,70%,100%{opacity:0;transform:translateX(-120px)}45%{opacity:.3}65%{opacity:0;transform:translateX(210px)}}
    body.done .medal{animation:medalDone .7s var(--ease)}
    @keyframes medalDone{50%{transform:translate(-50%,-50%) rotate(-5deg) scale(1.06)}}

    /* Texte et progression */
    .copy{text-align:center;margin-top:clamp(4px,1.5vh,16px);width:min(340px,100%)}
    .rule{display:block;width:40px;height:1px;background:var(--gold);margin:0 auto 16px;animation:ruleIn .8s var(--ease) .3s both}
    @keyframes ruleIn{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
    h1{font-family:var(--serif);font-weight:400;font-size:clamp(26px,4vh,34px);line-height:1.12;margin:0 0 10px;animation:fadeUp .8s var(--ease) .4s both}
    h1 .dots span{display:inline-block;animation:dot 1.4s ease-in-out infinite}
    h1 .dots span:nth-child(2){animation-delay:.2s}
    h1 .dots span:nth-child(3){animation-delay:.4s}
    body.done h1 .dots{display:none}
    @keyframes dot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

    .status{height:20px;position:relative;overflow:hidden;font-size:13px;color:rgba(255,255,255,.72);margin-bottom:22px;animation:fadeUp .8s var(--ease) .5s both}
    .status span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px}
    .status span.in{animation:statusIn .45s var(--ease) both}
    .status span.out{animation:statusOut .35s ease-in forwards}
    @keyframes statusIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes statusOut{to{opacity:0;transform:translateY(-12px)}}
    .status svg{width:14px;height:14px;color:var(--success)}

    .progress{animation:fadeUp .8s var(--ease) .6s both}
    .track-bar{position:relative;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
    .fill{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--gold),var(--gold-soft));border-radius:inherit}
    .fill::after{content:"";position:absolute;top:0;bottom:0;width:60px;right:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shimmer 1.2s linear infinite}
    body.done .fill::after{display:none}
    @keyframes shimmer{from{transform:translateX(-200px)}to{transform:translateX(60px)}}
    .meta{display:flex;justify-content:space-between;margin-top:10px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5)}
    .meta .pct{color:var(--gold-soft);font-variant-numeric:tabular-nums}

    .steps{display:flex;justify-content:center;gap:8px;margin-top:18px;animation:fadeUp .8s var(--ease) .7s both}
    .steps i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);transition:background .4s,transform .4s var(--ease),width .4s var(--ease)}
    .steps i.active{background:var(--gold);width:18px;border-radius:3px}
    .steps i.complete{background:var(--gold-soft)}

    .actions{margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:10px}
    .actions[hidden]{display:none}
    .actions:not([hidden]){animation:fadeUp .6s var(--ease) both}
    .btn{height:46px;padding:0 22px;border-radius:8px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--green);transition:transform .2s var(--ease),box-shadow .2s}
    .btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.2)}
    .btn svg{width:16px;height:16px;transition:transform .25s var(--ease)}
    .btn:hover svg{transform:translateX(-3px)}
    .note{font-size:11px;color:rgba(255,255,255,.5);margin:0;max-width:300px;line-height:1.5}

    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

    @media (max-width:560px){
      .top{padding:18px 20px}
      .secure{display:none}
    }
    @media (max-height:560px){
      .hero{height:40vh}
      .foot{display:none}
    }
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="top">
    <a href="meditra-connexion.html" class="brand" aria-label="MÉDITRA — Ministère du Travail">
      <svg class="brand-mark" viewBox="0 0 42 52" fill="none" aria-hidden="true">
        <path d="M13 2H29L27 16L21 22L15 16Z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M21 20L24 24L29 23L30 28L35 30L32 35L33 40L28 41L25 46L21 43L17 46L14 41L9 40L10 35L7 30L12 28L13 23L18 24Z" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="21" cy="33" r="8" stroke="currentColor" stroke-width="1.5"/>
        <path d="M21 27L22.5 31L27 31L23.5 34L25 38L21 35.5L17 38L18.5 34L15 31L19.5 31Z" fill="var(--gold)"/>
      </svg>
      <span>
        <span class="brand-name">MÉDITRA</span>
        <span class="brand-sub">Ministère du Travail</span>
      </span>
    </a>
    <span class="secure">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Connexion sécurisée
    </span>
  </header>

  <main class="stage">
    <div class="hero" aria-hidden="true">
      <div class="orbit"></div>
      <div class="orbit inner"></div>
      <svg class="ring" viewBox="0 0 200 200">
        <circle class="track" cx="100" cy="100" r="98"/>
        <circle class="bar" id="ring-bar" cx="100" cy="100" r="98"/>
        <circle class="dot" id="ring-dot" cx="198" cy="100" r="2.6"/>
      </svg>
      <div class="medal" data-medal></div>
    </div>

    <div class="copy">
      <span class="rule" aria-hidden="true"></span>
      <h1 id="title">Connexion en cours<span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></h1>
      <div class="status" id="status" role="status" aria-live="polite"><span class="in">Vérification de vos identifiants</span></div>

      <div class="progress" role="progressbar" aria-label="Progression de la connexion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
        <div class="track-bar"><div class="fill" id="fill"></div></div>
        <div class="meta"><span id="step-label">Étape 1 sur 3</span><span class="pct" id="pct">0 %</span></div>
      </div>

      <div class="steps" aria-hidden="true"><i class="active"></i><i></i><i></i></div>

      <div class="actions" id="actions" hidden>
        <a class="btn" href="meditra-connexion.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          Retour à la connexion
        </a>
        <p class="note">Démonstration : aucun tableau de bord n'est encore relié à cette page.</p>
      </div>
    </div>
  </main>

  <footer class="foot">République Gabonaise <span>·</span> Honneur · Travail · Mérite</footer>

  <script>
    (() => {
      /* Page vers laquelle rediriger une fois le chargement terminé.
         Laisser vide pour rester sur cette page (mode démonstration).
         On peut aussi passer ?next=tableau-de-bord.html dans l'URL. */
      const DEFAULT_NEXT = "";

      const $ = s => document.querySelector(s);
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // Redirection : uniquement vers une page locale (pas de lien externe)
      function safeNext(value) {
        if (!value) return "";
        if (/^[a-z][a-z0-9+.-]*:/i.test(value) || value.startsWith("//") || value.startsWith("\\")) return "";
        return value;
      }
      const next = safeNext(new URLSearchParams(location.search).get("next") || DEFAULT_NEXT);

      const STEPS = [
        { until: 34, text: "Vérification de vos identifiants" },
        { until: 72, text: "Sécurisation de votre session" },
        { until: 100, text: "Préparation de votre espace" }
      ];
      const DURATION = reduceMotion ? 900 : 3400;

      // --- Arc de progression ---
      const R = 98, CIRC = 2 * Math.PI * R;
      const bar = $("#ring-bar"), dot = $("#ring-dot");
      bar.style.strokeDasharray = CIRC;
      bar.style.strokeDashoffset = CIRC;

      function setProgress(p) {
        bar.style.strokeDashoffset = CIRC * (1 - p / 100);
        const a = (p / 100) * Math.PI * 2;
        dot.setAttribute("cx", (100 + R * Math.cos(a)).toFixed(2));
        dot.setAttribute("cy", (100 + R * Math.sin(a)).toFixed(2));
        $("#fill").style.transform = `scaleX(${p / 100})`;
        $("#pct").textContent = `${Math.round(p)} %`;
        $("#progress").setAttribute("aria-valuenow", Math.round(p));
      }

      // --- Texte d'état animé ---
      function setStatus(html) {
        const box = $("#status");
        const old = box.querySelector("span.in");
        if (old) { old.classList.remove("in"); old.classList.add("out"); setTimeout(() => old.remove(), 360); }
        const s = document.createElement("span");
        s.className = "in";
        s.innerHTML = html;
        box.appendChild(s);
      }

      function setStep(index) {
        $("#step-label").textContent = `Étape ${Math.min(index + 1, 3)} sur 3`;
        document.querySelectorAll(".steps i").forEach((el, i) => {
          el.className = i < index ? "complete" : i === index ? "active" : "";
        });
      }

      // --- Boucle : progression non linéaire, avec de légers paliers ---
      const ease = t => 1 - Math.pow(1 - t, 2.2);
      let start = null, stepIndex = 0;

      function frame(now) {
        if (start === null) start = now;
        const t = Math.min((now - start) / DURATION, 1);
        const wobble = reduceMotion ? 0 : Math.sin(t * Math.PI * 3) * 0.02 * (1 - t);
        const p = Math.min(100, Math.max(0, (ease(t) + wobble) * 100));
        setProgress(p);

        const idx = STEPS.findIndex(s => p < s.until);
        const current = idx === -1 ? STEPS.length - 1 : idx;
        if (current !== stepIndex) {
          stepIndex = current;
          setStep(current);
          setStatus(STEPS[current].text);
        }

        if (t < 1) requestAnimationFrame(frame);
        else finish();
      }

      function finish() {
        setProgress(100);
        document.querySelectorAll(".steps i").forEach(el => { el.className = "complete"; });
        $("#step-label").textContent = "Terminé";
        document.body.classList.add("done");
        $("#title").firstChild.textContent = "Bienvenue";
        setStatus('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg> Votre espace est prêt');
        document.title = "MÉDITRA — Espace prêt";

        if (next) {
          setTimeout(() => {
            document.body.classList.add("leaving");
            setTimeout(() => { location.href = next; }, reduceMotion ? 0 : 520);
          }, reduceMotion ? 200 : 900);
        } else {
          setTimeout(() => { $("#actions").hidden = false; }, reduceMotion ? 0 : 700);
        }
      }

      // --- Particules ---
      if (!reduceMotion) {
        const bg = document.querySelector(".bg");
        for (let i = 0; i < 18; i++) {
          const p = document.createElement("span");
          p.className = "particle";
          const size = 2 + Math.random() * 5;
          p.style.cssText =
            `left:${(Math.random() * 100).toFixed(1)}%;top:${(25 + Math.random() * 75).toFixed(1)}%;` +
            `width:${size.toFixed(1)}px;height:${size.toFixed(1)}px;` +
            `--d:${(7 + Math.random() * 7).toFixed(1)}s;--delay:${(-Math.random() * 10).toFixed(1)}s`;
          bg.appendChild(p);
        }
      }

      // --- Médaille (identique à la page de connexion) ---
      function star(cx, cy, outer, inner, points, rotation) {
        rotation = rotation === undefined ? -90 : rotation;
        const a = [];
        for (let i = 0; i < points * 2; i++) {
          const angle = (rotation + i * 180 / points) * Math.PI / 180, r = i % 2 ? inner : outer;
          a.push((cx + Math.cos(angle) * r).toFixed(2) + ',' + (cy + Math.sin(angle) * r).toFixed(2));
        }
        return a.join(' ');
      }

      function medalSVG() {
        const id = 'loader-medal';
        const rays = star(210, 414, 143, 133, 40);
        let beads = '', ribbonLines = '', leaves = '';
        for (let i = 0; i < 66; i++) {
          const a = i * Math.PI / 33;
          beads += '<circle cx="' + (210 + 121 * Math.cos(a)).toFixed(2) + '" cy="' + (414 + 121 * Math.sin(a)).toFixed(2) + '" r="1.35" fill="#f1cf91" opacity=".66"/>';
        }
        for (let i = 0; i < 38; i++) {
          ribbonLines += '<path d="M' + (140 + i * 3.7) + ' 33 L' + (158 + i * 2.7) + ' 247" stroke="' + (i % 2 ? '#fff' : '#071d15') + '" stroke-width="1" opacity="' + (i % 2 ? '.075' : '.12') + '"/>';
        }
        [-1, 1].forEach(side => {
          for (let j = 0; j < 9; j++) {
            const a = (35 + j * 11) * Math.PI / 180;
            const x = 210 + side * Math.sin(a) * 98, y = 414 + Math.cos(a) * 98;
            leaves += '<ellipse cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" rx="4" ry="10" transform="rotate(' + (side * (j * 11 - 23)) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')" fill="#f1cf91" opacity=".65"/>';
          }
        });
        const B = '#f1cf91', M = '#bb8849', D = '#73451e', S = '#3c2817', F = '#b98243';
        return '<div class="medal-float"><svg class="medal-svg" viewBox="0 0 420 590" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>' +
          '<linearGradient id="' + id + '-metal" x1="0" y1="0" x2=".88" y2="1"><stop offset="0" stop-color="' + B + '"/><stop offset=".23" stop-color="' + M + '"/><stop offset=".48" stop-color="' + B + '"/><stop offset=".65" stop-color="' + M + '"/><stop offset="1" stop-color="' + D + '"/></linearGradient>' +
          '<radialGradient id="' + id + '-face" cx="32%" cy="25%" r="82%"><stop stop-color="' + B + '"/><stop offset=".48" stop-color="' + F + '"/><stop offset="1" stop-color="' + D + '"/></radialGradient>' +
          '<linearGradient id="' + id + '-ribbon"><stop stop-color="#005d3e"/><stop offset=".16" stop-color="#189b68"/><stop offset=".45" stop-color="#168656"/><stop offset=".73" stop-color="#087146"/><stop offset="1" stop-color="#044b33"/></linearGradient>' +
          '<linearGradient id="' + id + '-yellow"><stop stop-color="#b8a534"/><stop offset=".24" stop-color="#edcf60"/><stop offset=".56" stop-color="#ddbf4c"/><stop offset="1" stop-color="#b09b2e"/></linearGradient>' +
          '<linearGradient id="' + id + '-blue"><stop stop-color="#346e91"/><stop offset=".4" stop-color="#6b9db8"/><stop offset="1" stop-color="#255878"/></linearGradient>' +
          '<linearGradient id="' + id + '-shine"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff3c9" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>' +
          '<clipPath id="' + id + '-ribbonclip"><path d="M135 33H285L264 238L210 283L156 238Z"/></clipPath>' +
          '<clipPath id="' + id + '-circleclip"><circle cx="210" cy="414" r="127"/></clipPath>' +
          '<path id="' + id + '-toptext" d="M112 414A98 98 0 0 1 308 414"/>' +
          '<path id="' + id + '-bottomtext" d="M111 444A104 104 0 0 0 309 444"/>' +
          '<pattern id="' + id + '-grain" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".55" fill="#fff5cf" opacity=".1"/><circle cx="4" cy="3" r=".5" fill="#302714" opacity=".11"/></pattern>' +
